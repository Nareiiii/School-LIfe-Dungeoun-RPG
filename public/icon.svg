<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1B365D" />
      <stop offset="100%" stop-color="#090D16" />
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Outer magical circle -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="8 6" opacity="0.6" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="#0D9488" stroke-width="2" opacity="0.4" />

  <!-- Crest Shield -->
  <path d="M 256 90 Q 360 110 370 210 Q 370 330 256 420 Q 142 330 142 210 Q 152 110 256 90 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="12" filter="url(#glow)" />

  <!-- Shield Inner Border -->
  <path d="M 256 114 Q 342 130 350 215 Q 350 315 256 395 Q 162 315 162 215 Q 170 130 256 114 Z" 
        fill="#111827" stroke="#38BDF8" stroke-width="3" opacity="0.85" />

  <!-- Crossed Swords & Open Spellbook -->
  <!-- Left Sword -->
  <path d="M 180 180 L 332 332 M 165 195 L 195 165" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
  <!-- Right Sword -->
  <path d="M 332 180 L 180 332 M 347 195 L 317 165" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />

  <!-- Center Open Book (Study Symbol) -->
  <g transform="translate(256, 255) scale(1.1)">
    <path d="M 0 -20 C 25 -40 60 -40 80 -30 L 80 35 C 60 25 25 25 0 45 C -25 25 -60 25 -80 35 L -80 -30 C -60 -40 -25 -40 0 -20 Z" 
          fill="#1E293B" stroke="url(#goldGrad)" stroke-width="6" />
    <path d="M 0 -20 L 0 45" stroke="url(#goldGrad)" stroke-width="5" />
    <!-- Book Bookmark Ribbon -->
    <path d="M 0 45 L 8 68 L 0 60 L -8 68 Z" fill="#EF4444" />
  </g>

  <!-- Glowing Focus Gem -->
  <polygon points="256,150 270,175 256,200 242,175" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" filter="url(#glow)" />
  <circle cx="256" cy="175" r="4" fill="#FFFFFF" />

  <!-- Small Stars / Sparks -->
  <circle cx="160" cy="130" r="4" fill="#FDE047" />
  <circle cx="352" cy="130" r="4" fill="#FDE047" />
  <circle cx="256" cy="455" r="5" fill="#38BDF8" />
</svg>
